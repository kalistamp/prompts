name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test persistence and security invariants
        run: |
          for f in supabase-config.js settings.js cloud.js diff.js markdown.js runner.js script.js; do
            node --check "$f"
          done
          node --test tests/cloud.test.mjs tests/markdown.test.js

          # A NUL byte makes git treat the file as binary, so it stops
          # producing diffs and hides whatever it sits inside.
          #
          # Done in node rather than grep deliberately: expressing a NUL
          # as a shell escape means the pattern must survive every layer
          # that writes this file, and the first version of this check
          # was itself corrupted by one. Reading bytes needs no escape
          # sequence. The workflow is in the list, so it now covers the
          # file it lives in.
          node -e "
            const fs = require('fs');
            const files = ['index.html', 'style.css', 'supabase-config.js', 'settings.js',
                           'cloud.js', 'diff.js', 'markdown.js', 'runner.js', 'script.js',
                           'docs/schema.sql', '.github/workflows/deploy-pages.yml'];
            const dirty = files.filter(f => fs.readFileSync(f).includes(0));
            if (dirty.length) { console.error('NUL byte in: ' + dirty.join(', ')); process.exit(1); }
            console.log('No NUL bytes in ' + files.length + ' files.');
          "

          grep -q "rpc('apply_prompt_changes'" cloud.js
          grep -q 'Content-Security-Policy' index.html

          # Icons are local. They used to come from a Font Awesome
          # stylesheet on cdnjs, which cost a render-blocking
          # third-party request and two CDN entries in the CSP. They
          # are now mask-image data URIs in style.css, so nothing may
          # reintroduce the CDN or the directives that allowed it.
          if grep -q 'cdnjs.cloudflare.com' index.html style.css; then
            echo "The icon CDN is back in a deployed file" >&2
            exit 1
          fi
          grep -q "style-src 'self';" index.html
          grep -q "font-src 'none';" index.html

          # Every icon the markup asks for must have a definition, or
          # it renders as a blank gap where a control used to be.
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('index.html', 'utf8') + fs.readFileSync('script.js', 'utf8');
            const css = fs.readFileSync('style.css', 'utf8');
            const used = new Set();
            for (const m of src.matchAll(/\bfa-([a-z0-9-]+)/g)) if (m[1] && m[1] !== 'spin') used.add(m[1]);
            // Names built by a template literal, e.g. fa-\${dark ? 'sun' : 'moon'}
            for (const m of src.matchAll(/fa-\\\$\{[^}]*?'([a-z0-9-]+)'\s*:\s*'([a-z0-9-]+)'[^}]*\}/g)) { used.add(m[1]); used.add(m[2]); }
            for (const m of src.matchAll(/fa-chevron-\\\$\{[^}]*?'([a-z]+)'\s*:\s*'([a-z]+)'/g)) { used.add('chevron-' + m[1]); used.add('chevron-' + m[2]); }
            used.delete('chevron-');
            const defined = new Set([...css.matchAll(/^\.fa-([a-z0-9-]+) \{/gm)].map(m => m[1]));
            const missing = [...used].filter(n => !defined.has(n));
            if (missing.length) {
              console.error('Icons used but not defined in style.css: ' + missing.join(', '));
              process.exit(1);
            }
            console.log(used.size + ' icons used, all defined.');
          "

          # No inline event handlers: the script CSP would block them,
          # so a stray onclick is a page that silently does nothing.
          if grep -Eqi 'on(click|change|input|submit)=' index.html script.js; then
            echo "Inline event handlers are blocked by the script CSP" >&2
            exit 1
          fi

          # Design tokens only.
          #
          # This used to be `tail -n +69`, a hardcoded line number for
          # the end of the token block. Two things were wrong with it.
          # It broke the moment the block grew by a line, and it only
          # looked for hex — so 17 rgba() values mixed by hand from the
          # LIGHT primary sat below it for months, unflagged, painting
          # every hover and focus state the wrong hue in dark mode.
          #
          # Now the block ends at a sentinel line, and rgb()/rgba()
          # count as raw colour too. Below the sentinel, colour comes
          # from var() or color-mix() or it does not ship.
          node -e "
            const fs = require('fs');
            const css = fs.readFileSync('style.css', 'utf8');
            const SENT = '/* ===== END DESIGN TOKENS ===== */';
            const at = css.indexOf(SENT);
            if (at < 0) {
              console.error('The END DESIGN TOKENS sentinel is missing from style.css.');
              process.exit(1);
            }
            const before = css.slice(0, at).split('\n').length;
            const bad = css.slice(at + SENT.length).split('\n')
              .map((line, i) => [before + i, line])
              .filter(([, line]) => /#[0-9a-fA-F]{3,8}\b|\brgba?\(/.test(line));
            if (bad.length) {
              console.error('Raw colour below the token sentinel in style.css:');
              bad.forEach(([n, line]) => console.error('  ' + n + ': ' + line.trim()));
              process.exit(1);
            }
            console.log('style.css: no raw colour below the token sentinel.');
          "

          # Colour must come from the two explicit data-theme states,
          # never from the OS preference.
          #
          # Comments are stripped first. A plain grep here also
          # matched the token block's own comment explaining the
          # rule, so the file could not document the constraint it
          # was subject to — the same self-referential trap the NUL
          # check above was written to avoid.
          node -e "
            const fs = require('fs');
            const css = fs.readFileSync('style.css', 'utf8').replace(/\/\*[\s\S]*?\*\//g, '');
            if (/prefers-color-scheme/.test(css)) {
              console.error('prefers-color-scheme must not decide colour');
              process.exit(1);
            }
            console.log('style.css: colour comes from data-theme only.');
          "

          # No secret may ever reach the published site. The Supabase
          # publishable key is fine and is expected; a service-role JWT
          # or a provider API key is not.
          #
          # Each pattern requires real key material, so the "sk-ant-…"
          # placeholder in settings.js and the service_role warning in
          # the supabase-config.js comment do not trip it.
          if grep -rEq 'sk-ant-[A-Za-z0-9_-]{24,}|sk-proj-[A-Za-z0-9_-]{24,}|AIzaSy[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}' \
              index.html style.css supabase-config.js settings.js cloud.js diff.js markdown.js runner.js script.js; then
            echo "A secret-looking value is present in a deployed file" >&2
            exit 1
          fi

      - name: Verify the inline theme bootstrap matches its CSP hash
        run: |
          # The inline script that sets data-theme before first paint is
          # allowed by a sha384 hash in the CSP. Editing the script
          # without recomputing the hash leaves a page that loads but
          # never applies the saved theme, with nothing in the diff to
          # show why — so the build checks it.
          node -e "
            const fs = require('fs'), crypto = require('crypto');
            const html = fs.readFileSync('index.html', 'utf8');
            const m = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!m) { console.error('No inline bootstrap script found'); process.exit(1); }
            const hash = 'sha384-' + crypto.createHash('sha384').update(m[1], 'utf8').digest('base64');
            if (!html.includes(hash)) {
              console.error('CSP hash does not match the inline script.');
              console.error('Expected: ' + hash);
              process.exit(1);
            }
            console.log('Inline bootstrap hash matches: ' + hash);
          "

      - name: Build Pages artifact
        run: |
          mkdir _site
          cp index.html style.css supabase-config.js settings.js cloud.js diff.js markdown.js runner.js script.js .nojekyll _site/

          # Every file the page asks for must be in the artifact. A new
          # file added to index.html but not to the cp list above is the
          # failure this catches.
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('_site/index.html', 'utf8');
            const refs = [...html.matchAll(/(?:src|href)=\"\.?\/?([A-Za-z0-9_.-]+\.(?:js|css))(?:\?[^\"]*)?\"/g)]
              .map(m => m[1]);
            const missing = [...new Set(refs)].filter(f => !fs.existsSync('_site/' + f));
            if (missing.length) {
              console.error('Referenced but not copied into _site: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('All ' + new Set(refs).size + ' local assets present in the artifact.');
          "

          # The published config must carry real values, not placeholders.
          if grep -q 'PUT_YOUR_' _site/supabase-config.js; then
            echo "supabase-config.js still contains placeholders" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
