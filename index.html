<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Organize and securely sync reusable AI prompts.">
    <title>Prompt Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <section id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <i class="fas fa-wand-magic-sparkles auth-icon"></i>
            <h1>Prompt Studio</h1>
            <p>Sign in to securely sync your prompts.</p>
            <form id="login-form">
                <div class="form-control">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" autocomplete="email" required>
                </div>
                <div class="form-control">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" autocomplete="current-password" required>
                </div>
                <button class="btn auth-submit" type="submit"><i class="fas fa-right-to-bracket"></i> Sign in</button>
                <p id="login-error" class="form-error" role="alert" aria-live="polite"></p>
            </form>
        </div>
    </section>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2><i class="fas fa-cloud"></i> Cloud Sync</h2>
            <p class="modal-desc">Your prompts are stored in the <strong>prompts</strong> schema and protected by your Supabase account.</p>
            <div class="account-row">
                <span>Signed in as</span>
                <strong id="account-email"></strong>
            </div>
            <div class="account-row">
                <span>Status</span>
                <strong id="cloud-status">Checking…</strong>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="sign-out-btn"><i class="fas fa-right-from-bracket"></i> Sign out</button>
                <button class="btn" id="close-settings-btn">Done</button>
            </div>
        </div>
    </div>

    <!-- Prompt Modal -->
    <div id="prompt-modal" class="modal">
        <div class="modal-content modal-large">
            <h2 id="prompt-modal-title">Add New Prompt</h2>
            <form id="prompt-form">
                <div class="form-control">
                    <label>Title *</label>
                    <input type="text" id="prompt-title" required placeholder="e.g. Code Reviewer">
                </div>
                <div class="form-row">
                    <div class="form-control flex-grow">
                        <label>Category</label>
                        <input type="text" id="prompt-category" placeholder="e.g. Coding" list="category-list">
                        <datalist id="category-list"></datalist>
                    </div>
                    <div class="form-control flex-grow">
                        <label>Tags (comma separated)</label>
                        <input type="text" id="prompt-tags" placeholder="e.g. react, debug">
                    </div>
                </div>
                <div class="form-control">
                    <label>Prompt Text *</label>
                    <textarea id="prompt-text" required rows="6" placeholder="You are an expert..."></textarea>
                </div>
                <div class="form-control">
                    <label>Notes (Optional)</label>
                    <textarea id="prompt-notes" rows="2" placeholder="Any usage notes..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn" id="save-prompt-btn">Save Prompt</button>
                    <button type="button" class="btn btn-secondary" id="close-prompt-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="app-container" id="app-container" hidden>
        <header>
            <div class="header-left">
                <h1>Prompt Studio</h1>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="theme-toggle" title="Toggle Dark Mode"><i class="fas fa-moon"></i></button>
                <button class="icon-btn" id="sync-btn" title="Cloud Sync"><i class="fas fa-cloud"></i></button>
                <button class="icon-btn" id="settings-btn" title="Settings"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <main>
            <div class="toolbar">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search prompts, tags...">
                    <button class="clear-search-btn" id="clear-search-btn" title="Clear search"><i class="fas fa-times"></i></button>
                </div>
                <div class="filters">
                    <select id="category-filter">
                        <option value="">All Categories</option>
                    </select>
                    <select id="sort-select">
                        <option value="date-desc">Newest First</option>
                        <option value="date-asc">Oldest First</option>
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="custom">Custom Order</option>
                    </select>
                    <div class="view-switcher" role="group" aria-label="View mode">
                        <button class="view-btn" id="view-large" title="Large Icons — full prompt" aria-label="Large Icons view" onclick="setView('large')"><i class="fas fa-table-cells-large"></i></button>
                        <button class="view-btn" id="view-list" title="List — preview" aria-label="List view" onclick="setView('list')"><i class="fas fa-list"></i></button>
                        <button class="view-btn" id="view-compact" title="Compact — dense" aria-label="Compact view" onclick="setView('compact')"><i class="fas fa-bars"></i></button>
                    </div>
                    <button class="btn" id="add-prompt-btn"><i class="fas fa-plus"></i> New Prompt</button>
                </div>
            </div>

            <div id="prompts-container">
                <!-- Category sections injected here -->
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
